<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editor de Tablero</title>
  <style>
    /*! chessboard.js v1.0.0 CSS (inlined to avoid MIME-type issues) */
    .clearfix-7da63{clear:both}.board-b72b1{border:2px solid #404040;box-sizing:content-box}.square-55d63{float:left;position:relative;-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}.white-1e1d7{background-color:#f0d9b5;color:#b58863}.black-3c85d{background-color:#b58863;color:#f0d9b5}.highlight1-32417,.highlight2-9c5d2{box-shadow:inset 0 0 3px 3px #ff0}.notation-322f9{cursor:default;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;position:absolute}.alpha-d2270{bottom:1px;right:3px}.numeric-fc462{top:2px;left:2px}
  </style>
  <style>
    :root {
      --bg: #0f1420;
      --panel: rgba(15, 20, 30, 0.7);
      --accent: #00e5ff;
      --accent2: #f72585;
      --text: #e0e0e0;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    #board {
      width: 420px;
      max-width: 100%;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 480px;
    }
    .panel h3 {
      margin: 0 0 12px 0;
      color: var(--accent);
      font-size: 1.05rem;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      padding-bottom: 8px;
    }
    .phase-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .phase-setup { background: rgba(0, 229, 255, 0.15); color: var(--accent); border: 1px solid var(--accent); }
    .phase-move  { background: rgba(247, 37, 133, 0.15); color: var(--accent2); border: 1px solid var(--accent2); }
    .phase-done  { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
    .row { margin-bottom: 14px; }
    .row label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .turn-toggle { display: flex; gap: 8px; }
    .turn-toggle button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .turn-toggle button.active {
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.15s;
      margin-top: 6px;
    }
    .btn-primary { background: var(--accent); color: #0f1420; }
    .btn-primary:hover { background: #4cc9f0; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.2); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .info {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 10px;
    }
    .fen-box {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 6px;
      word-break: break-all;
      color: var(--accent);
      margin-top: 6px;
      min-height: 32px;
    }
    .move-box {
      font-family: 'Courier New', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent2);
      text-align: center;
      padding: 10px;
      background: rgba(247, 37, 133, 0.1);
      border-radius: 6px;
      margin-top: 6px;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 8px;
      padding: 8px;
      background: rgba(0, 229, 255, 0.08);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="board"></div>

    <div class="panel">
      <h3>Editor de Posición</h3>
      <div id="phaseBadge" class="phase-badge phase-setup">Fase 1: Montar posición</div>

      <!-- FASE 1: SETUP -->
      <div id="setupControls">
        <div class="row">
          <label>Turno (quién juega)</label>
          <div class="turn-toggle">
            <button id="turnWhite" class="active" onclick="setTurn('w')">Blancas</button>
            <button id="turnBlack" onclick="setTurn('b')">Negras</button>
          </div>
        </div>

        <div class="row">
          <label>FEN de la posición</label>
          <div class="fen-box" id="setupFen">—</div>
        </div>

        <button class="btn btn-primary" onclick="confirmSetup()">Confirmar posición →</button>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button class="btn btn-secondary" style="margin-top:0;" onclick="flipBoard()">↻ Rotar tablero</button>
          <button class="btn btn-secondary" style="margin-top:0;" onclick="clearBoard()">Limpiar</button>
        </div>
        <div class="info">Arrastra piezas desde los lados hacia el tablero. Para quitar una pieza, arrástrala fuera del tablero.</div>
      </div>

      <!-- FASE 2: PRIMER MOVIMIENTO -->
      <div id="moveControls" style="display:none;">
        <div class="hint">Ahora arrastra una pieza en el tablero para realizar el <b>primer movimiento</b> del puzzle. Solo movimientos legales.</div>

        <div class="row" style="margin-top:14px;">
          <label>Posición inicial (FEN)</label>
          <div class="fen-box" id="moveFen">—</div>
        </div>

        <div class="row">
          <label>Primer movimiento (UCI)</label>
          <div class="move-box" id="moveUci">—</div>
        </div>

        <div style="display:flex; gap:8px; margin-top:6px;">
          <button class="btn btn-secondary" style="margin-top:0;" onclick="flipBoard()">↻ Rotar tablero</button>
          <button class="btn btn-secondary" style="margin-top:0;" onclick="resetToSetup()">← Volver a editar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./jquery-3.7.1.min.js"></script>
  <script src="./chessboard-1.0.0.min.js"></script>
  <script src="./chess.min.js"></script>
  <script src="./streamlit-component-lib.js"></script>

  <script>
    // Streamlit ya está disponible como global (window.Streamlit) tras cargar
    // streamlit-component-lib.js como script normal (no ESM) para evitar
    // problemas de MIME type con Streamlit's static component serving.

    // Estado interno
    const state = {
      phase: 'setup',
      turn: 'w',
      setup_fen: '',
      first_move_uci: ''
    };

    let board = null;
    let game = null;
    const PIECE_THEME = (piece) => 'pieces/' + piece.charAt(0) + piece.charAt(1).toLowerCase() + '.png';

    // --- Comunicación con Streamlit ---
    function emit() {
      Streamlit.setComponentValue({
        phase: state.phase,
        setup_fen: state.setup_fen,
        first_move_uci: state.first_move_uci
      });
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, () => {
      Streamlit.setFrameHeight(820);
    });

    // Avisar a Streamlit que el componente está listo para recibir datos.
    // Esto es OBLIGATORIO: sin esta llamada, Streamlit muestra
    // "having trouble loading the component".
    Streamlit.setComponentReady();

    // Valor inicial
    emit();

    // --- Inicializar tablero en modo SETUP ---
    function initSetupBoard() {
      const orientation = state.turn === 'w' ? 'white' : 'black';
      if (board) { try { board.destroy(); } catch (e) {} }
      board = Chessboard('board', {
        position: 'start',
        draggable: true,
        dropOffBoard: 'trash',
        sparePieces: true,
        pieceTheme: PIECE_THEME,
        orientation: orientation,
        onDrop: updateSetupFen
      });
    }

    function updateSetupFen() {
      const posFen = board.fen();
      state.setup_fen = posFen + ' ' + state.turn + ' - - 0 1';
      document.getElementById('setupFen').textContent = state.setup_fen;
      emit();
    }

    window.setTurn = function(t) {
      state.turn = t;
      document.getElementById('turnWhite').classList.toggle('active', t === 'w');
      document.getElementById('turnBlack').classList.toggle('active', t === 'b');
      if (state.phase === 'setup') {
        const currentFen = board.fen();
        initSetupBoard();
        board.position(currentFen, false);
        updateSetupFen();
      }
    };

    window.clearBoard = function() {
      board.position('empty');
      updateSetupFen();
    };

    window.flipBoard = function() {
      // Rotar la vista del tablero (blancas abajo <-> negras abajo) sin alterar piezas ni turno.
      if (board) { try { board.flip(); } catch (e) {} }
    };

    window.confirmSetup = function() {
      const posFen = board.fen();
      if (posFen === '8/8/8/8/8/8/8/8') {
        alert('El tablero está vacío. Coloca las piezas (incluyendo ambos reyes) antes de confirmar.');
        return;
      }
      state.setup_fen = posFen + ' ' + state.turn + ' - - 0 1';
      game = new Chess();
      if (!game.load(state.setup_fen)) {
        alert('FEN inválido. Verifica el formato de la posición.');
        return;
      }
      // Validar presencia de ambos reyes
      const b = game.board();
      let hasWK = false, hasBK = false;
      b.forEach(row => row.forEach(p => {
        if (p && p.type === 'k' && p.color === 'w') hasWK = true;
        if (p && p.type === 'k' && p.color === 'b') hasBK = true;
      }));
      if (!hasWK || !hasBK) {
        alert('La posición debe contener un rey blanco y un rey negro.');
        return;
      }
      state.phase = 'move';
      state.first_move_uci = '';
      document.getElementById('setupControls').style.display = 'none';
      document.getElementById('moveControls').style.display = 'block';
      const badge = document.getElementById('phaseBadge');
      badge.className = 'phase-badge phase-move';
      badge.textContent = 'Fase 2: Primer movimiento';
      document.getElementById('moveFen').textContent = state.setup_fen;
      document.getElementById('moveUci').textContent = '—';

      // Reconstruir tablero en modo movimiento
      board.destroy();
      const orientation = state.turn === 'w' ? 'white' : 'black';
      board = Chessboard('board', {
        position: posFen,
        draggable: true,
        dropOffBoard: 'snapback',
        sparePieces: false,
        pieceTheme: PIECE_THEME,
        orientation: orientation,
        onDrop: handleMoveDrop
      });
      emit();
    };

    function handleMoveDrop(source, target, piece, newPos, oldPos, orientation) {
      if (source === target) return 'snapback';
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) {
        return 'snapback';
      }
      state.first_move_uci = move.from + move.to + (move.promotion ? move.promotion : '');
      state.phase = 'done';
      document.getElementById('moveUci').textContent = state.first_move_uci;
      const badge = document.getElementById('phaseBadge');
      badge.className = 'phase-badge phase-done';
      badge.textContent = '✓ Posición y movimiento listos';
      board.position(game.fen().split(' ')[0], false);
      emit();
    }

    window.resetToSetup = function() {
      state.phase = 'setup';
      state.first_move_uci = '';
      state.setup_fen = '';
      game = null;
      document.getElementById('setupControls').style.display = 'block';
      document.getElementById('moveControls').style.display = 'none';
      const badge = document.getElementById('phaseBadge');
      badge.className = 'phase-badge phase-setup';
      badge.textContent = 'Fase 1: Montar posición';
      document.getElementById('setupFen').textContent = '—';
      initSetupBoard();
      updateSetupFen();
    };

    // --- Arranque ---
    $(document).ready(() => {
      initSetupBoard();
      updateSetupFen();
    });
  </script>
</body>
</html>
